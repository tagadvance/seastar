# Classes run concurrently; methods within a class stay ordered on one thread, because the
# fidelity groups are ordered suites. Each fidelity group owns its own keyspaces, which is what
# makes concurrent classes safe against the shared container node too. Parallelism is fixed and
# modest rather than one-per-core: every wire class is a Netty server plus two driver sessions,
# and enough of them at once starve a driver's 500 ms connection-init budget on a busy machine.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
