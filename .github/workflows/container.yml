name: container

# The fidelity suite is what makes "SeaStar behaves like Cassandra" measurable rather than
# aspirational, but it needs Docker and a few minutes, so it runs nightly instead of per push.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Fidelity suite against a real node
        run: ./gradlew :seastar:containerTest

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: container-test-results
          path: seastar/build/reports/tests/
