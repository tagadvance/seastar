# Classes stay serial in this module for now. Running them concurrently surfaces intermittent
# segment corruption - SegmentFramingTest fails its CRC check reliably under a concurrent suite
# and never alone, and a fidelity class's driver connection occasionally dies the same way - which
# smells like a pooled-buffer lifecycle race in the server's write path, not a test problem.
# Flipping classes.default to concurrent is the switch, once that is run down; the @Isolated
# annotations in this module already mark the tests that must stay exclusive when it is.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
