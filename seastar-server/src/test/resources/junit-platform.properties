# The corruption that once kept these classes serial - SegmentFramingTest failing its CRC check
# under a concurrent suite, a fidelity class's driver connection occasionally dying the same way -
# was the handshake framing switch reaching the event loop as two tasks; see the comment in
# SeaStarProtocolHandler#respond. With the switch atomic the classes run concurrently, and the
# @Isolated annotations in this module mark the tests that must stay exclusive.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
